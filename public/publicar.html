<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Publicar disco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="stylesheet" href="/css/style.css">
<style>.wrap{max-width:700px}.wrap form.panel,.wrap .panel{max-width:none}
.usar-perfil{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#444;
  margin:14px 0 6px;cursor:pointer;font-weight:400}
.usar-perfil input{width:auto;margin:0;cursor:pointer}
.bloqueado{background:#f2f2f2;color:#666;cursor:not-allowed}</style>
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, GRADOS, toast, fmtPrecio, precioComprador, ADMIN_ID, zonaSelector, authHeaders } from "/js/app.js?v=3";
import { traerDeDiscogs } from "/js/discogs.js?v=2";
renderHeader("publicar");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés publicar.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) { location.href = "/cuenta.html"; return; }
  const perfil = await getPerfil(user.id);
  if (!perfil) { location.href = "/cuenta.html"; return; }

  // Requisito para vender: tener el alias cargado, para poder transferirle
  if (!perfil.alias) {
    main.innerHTML = `
      <h1>Un paso antes de publicar</h1>
      <p class="sub">Cargá el alias donde querés cobrar tus ventas. Es una sola vez y tarda diez segundos.</p>
      <div class="panel">
        <strong>¿Por qué?</strong>
        <p class="hint" style="margin:6px 0 14px">El comprador paga a través de SURCOGS y su plata queda protegida hasta que confirma que recibió el disco. Ahí te transferimos a vos, dentro de las 48hs hábiles. Recibís exactamente el precio que publicás: las comisiones las paga el comprador.</p>
        <a class="btn" href="/cuenta.html">Cargar mi alias</a>
      </div>`;
    return;
  }

  // ¿Modo edición?
  const editId = new URLSearchParams(location.search).get("edit");
  let editRec = null;
  if (editId) {
    const { data } = await sb.from("records").select("*").eq("id", editId).maybeSingle();
    const puedeEditar = data && (data.seller_id === user.id || user.id === ADMIN_ID);
    if (!puedeEditar) { toast("No encontramos ese disco entre los tuyos", true); location.href = "/perfil.html?id=" + user.id; return; }
    // Un disco vendido no se toca: alguien ya pagó por él tal como estaba publicado
    if (data.status === "vendido") {
      toast("Ese disco ya se vendió, no se puede editar", true);
      location.href = "/disco.html?id=" + data.id;
      return;
    }
    editRec = data;
  }

  main.innerHTML = `
    <h1>${editRec ? "Editar disco" : "Publicar un disco"}</h1>
    <p class="sub">${editRec ? "Cambiá lo que necesites y guardá. Si bajás el precio, el anterior queda tachado en el catálogo." : "Publicar es gratis. La comisión se descuenta sola al vender."}</p>
    <form class="panel" id="f">
      <label>¿Está en Discogs? Pegá el link y completamos todo</label>
      <div style="display:flex;gap:8px">
        <input id="dg-url" placeholder="https://www.discogs.com/release/…" style="flex:1">
        <button class="btn small" type="button" id="btn-dg">Traer datos</button>
      </div>
      <p class="hint" id="dg-hint">Autocompleta artista, título, sello, año, formato, los temas con su audio y la tapa.</p>
      <div class="divider"><span>datos del disco</span></div>
      <div class="row2">
        <div><label>Artista *</label><input id="artist" required></div>
        <div><label>Título *</label><input id="title" required></div>
      </div>
      <div class="row2">
        <div><label>Sello</label><input id="label" placeholder="Purpose Maker"></div>
        <div><label>Año</label><input id="year" type="number" min="1940" max="2030"></div>
      </div>
      <div class="row2">
        <div><label>Género *</label>
          <select id="genre">
            <option>Techno</option><option>House</option><option>Electro</option>
            <option>Minimal</option><option>Otro</option>
          </select>
        </div>
        <div></div>
      </div>
      <div class="row2">
        <div><label>Formato</label>
          <select id="format"><option>12"</option><option>2×12"</option><option>7"</option><option>10"</option><option>LP</option><option>2×LP</option></select>
        </div>
        <div><label>Precio recibido *</label>
          <div style="position:relative">
            <span style="position:absolute;left:11px;top:9px;color:var(--dim);font-size:13.5px">$</span>
            <input id="price" type="number" min="1" placeholder="0" required style="padding-left:24px">
          </div>
        </div>
      </div>
      <div class="row2">
        <div><label>Estado del disco *</label>
          <select id="cm">${GRADOS.map(g => `<option ${g === "VG+" ? "selected" : ""}>${g}</option>`).join("")}</select>
        </div>
      </div>
      <p class="hint">Goldmine: M sellado o nunca reproducido · NM casi perfecto · VG+ uso leve · VG uso evidente · G+ / G ruido considerable. Ante la duda, poné el grado más bajo.</p>
      <label class="usar-perfil"><input type="checkbox" id="usar-perfil">
        Usar los datos de mi perfil</label>
      <div class="row2">
        <div><label>Zona</label><select id="zona"></select></div>
        <div><label>Localidad / barrio</label><input id="loc"></div>
      </div>
      <div class="row2">
        <div><label>Dirección de despacho *</label>
          <input id="dir" placeholder="Av. San Martín 1234, 2º A" required></div>
        <div><label>Código postal *</label>
          <input id="cp" placeholder="1688" inputmode="numeric" required></div>
      </div>
      <p class="hint" id="hint-despacho">Con tu código postal calculamos el envío a cada comprador. La dirección va en la etiqueta del envío y no se muestra en la publicación.</p>
      <p class="hint" style="margin-bottom:14px">🤝 <b>La entrega la coordinás con el comprador.</b> Se lo entregás en mano o lo despachan como prefieran los dos.</p>
      <label>Temas (se completan solos desde Discogs, o cargalos a mano)</label>
      <p class="hint" style="margin:-4px 0 10px">🎧 <b>Para que se pueda escuchar:</b> al lado de cada tema tenés dos botones,
      YouTube y SoundCloud. Tocá el que prefieras y se abre <b>ya buscando el nombre del artista más el del tema</b>, sin que escribas nada.
      Elegí la versión que mejor suene, copiá el link de la barra del navegador
      y pegalo en el casillero de al lado. Listo: el comprador lo escucha desde tu publicación, sin irse a ningún lado.</p>
      <div id="tracks-box"></div>
      <p class="hint">Los discos que se pueden escuchar se venden bastante más rápido. No hace falta cargar todos los temas: con uno o dos alcanza.</p>
      <button type="button" class="btn small ghost" id="btn-add-track">+ Agregar tema</button>
      <label>Fotos (hasta 4 — tapa, vinilo, etiqueta)</label>
      <p class="hint" style="margin:-4px 0 8px">La tapa la traemos de Discogs. Sumá fotos de <b>tu</b> ejemplar y tocá una para ponerla primera: esa es la que se ve en el catálogo.</p>
      <input id="fotos" type="file" accept="image/*" multiple>
      <div id="fotos-box" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px"></div>
      <label>Notas (opcional)</label><textarea id="desc" placeholder="Warp leve que no afecta reproducción, edición original US…"></textarea>
      <br><button class="btn" type="submit" id="btn-pub">${editRec ? "Guardar cambios" : "Publicar"}</button>
    </form>`;

  // Dirección y CP de despacho: vienen del perfil y se pueden corregir acá
  if (perfil.direccion) document.getElementById("dir").value = perfil.direccion;
  if (perfil.cp) document.getElementById("cp").value = perfil.cp;

  // Entrega: mostrar el costo solo si es envío fijo

  // Zona → localidad: hereda la del perfil (o la del disco en modo edición)
  zonaSelector(document.getElementById("zona"), document.getElementById("loc"),
    editRec ? (editRec.zona || "") : (perfil.zona || ""),
    editRec ? (editRec.localidad || "") : (perfil.localidad || ""));

  // "Usar los datos de mi perfil": copia zona, localidad, dirección y CP del
  // perfil y los deja bloqueados. Destildando, se pueden editar para este disco.
  (() => {
    const chk = document.getElementById("usar-perfil");
    const campos = ["zona", "loc", "dir", "cp"];
    const hayPerfil = Boolean(perfil.zona || perfil.direccion || perfil.cp);
    if (!hayPerfil) {                       // nada que copiar: se esconde
      chk.closest(".usar-perfil").style.display = "none";
      return;
    }
    const copiar = () => {
      document.getElementById("zona").value = perfil.zona || "";
      document.getElementById("zona").dispatchEvent(new Event("change"));
      document.getElementById("loc").value = perfil.localidad || "";
      document.getElementById("dir").value = perfil.direccion || "";
      document.getElementById("cp").value = perfil.cp || "";
    };
    const pintar = () => {
      campos.forEach((id) => {
        const el = document.getElementById(id);
        if (el.tagName === "SELECT") el.disabled = chk.checked;
        else el.readOnly = chk.checked;
        el.classList.toggle("bloqueado", chk.checked);
      });
      document.getElementById("hint-despacho").textContent = chk.checked
        ? "Estos datos salen de tu perfil. Destildá el casillero si este disco despacha desde otra dirección."
        : "Con tu código postal calculamos el envío a cada comprador. La dirección va en la etiqueta del envío y no se muestra en la publicación.";
    };
    // En edición arranca destildado si el disco tiene otra zona que el perfil
    const distinto = editRec &&
      ((editRec.zona || "") !== (perfil.zona || "") ||
       (editRec.localidad || "") !== (perfil.localidad || ""));
    chk.checked = !distinto;
    if (chk.checked) copiar();
    pintar();
    chk.onchange = () => { if (chk.checked) copiar(); pintar(); };
  })();

  // Precargar datos en modo edición
  if (editRec) {
    const set = (id, v) => { if (v !== null && v !== undefined) document.getElementById(id).value = v; };
    set("artist", editRec.artist); set("title", editRec.title); set("label", editRec.label);
    set("year", editRec.year); set("format", editRec.format); set("price", editRec.price);
    set("genre", editRec.genre || "Techno");
    set("cm", editRec.condition_media);
    set("audio", editRec.audio_url); set("desc", editRec.description);
      // Sin casillas de envio: todos los discos se entregan a coordinar.
  }

  // ---- Tracklist con audio por tema ----
  let tracks = editRec?.tracks?.length ? editRec.tracks.map(t => ({ ...t })) : [];
  function renderTracks() {
    const box = document.getElementById("tracks-box");
    box.innerHTML = tracks.map((t, i) => `
      <div style="border:1px solid var(--line);border-radius:2px;padding:10px;margin-bottom:8px">
        <div style="display:flex;gap:8px">
          <input data-i="${i}" data-k="position" value="${esc(t.position)}" placeholder="A1" style="width:64px">
          <input data-i="${i}" data-k="title" value="${esc(t.title)}" placeholder="Título del tema" style="flex:1">
          <button type="button" class="btn small ghost btn-del-track" data-i="${i}">✕</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
          <input data-i="${i}" data-k="audio_url" value="${esc(t.audio_url || "")}"
            placeholder="Pegá acá el link que copiaste" style="flex:1;min-width:180px">
          <button type="button" class="btn small ghost btn-buscar" data-i="${i}" data-p="yt" title="Abre YouTube buscando artista + tema" style="padding:6px 9px"><svg width="17" height="17" viewBox="0 0 24 24" style="pointer-events:none;vertical-align:-3px"><rect x="1" y="4.5" width="22" height="15" rx="4" fill="#FF0000"/><path d="M9.8 9l6.2 3-6.2 3z" fill="#fff"/></svg></button>
          <button type="button" class="btn small ghost btn-buscar" data-i="${i}" data-p="sc" title="Abre SoundCloud buscando artista + tema" style="padding:6px 9px"><svg width="17" height="17" viewBox="0 0 24 24" style="pointer-events:none;vertical-align:-3px"><g fill="#FF5500"><rect x="1" y="12" width="1.7" height="6" rx=".8"/><rect x="4" y="9.5" width="1.7" height="8.5" rx=".8"/><rect x="7" y="11" width="1.7" height="7" rx=".8"/><path d="M11 18V8.2a5 5 0 0 1 8.2 2.1A3.9 3.9 0 0 1 18.6 18H11z"/></g></svg></button>
        </div>
      </div>`).join("") || `<p class="hint">Sin temas cargados. Traelos desde Discogs o agregalos a mano.</p>`;

    box.querySelectorAll(".btn-buscar").forEach(b => b.onclick = () => {
      const t = tracks[Number(b.dataset.i)];
      const q = encodeURIComponent(((document.getElementById("artist").value || "") + " " + (t.title || "")).trim());
      // SoundCloud suele tener el techno que en YouTube no está, y el
      // reproductor de la ficha ya sabe embeber los dos.
      window.open(b.dataset.p === "sc"
        ? "https://soundcloud.com/search/sounds?q=" + q
        : "https://www.youtube.com/results?search_query=" + q, "_blank");
    });

    box.querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => {
      tracks[Number(inp.dataset.i)][inp.dataset.k] = inp.value;
    });
    box.querySelectorAll(".btn-del-track").forEach(b => b.onclick = () => {
      tracks.splice(Number(b.dataset.i), 1); renderTracks();
    });
  }
  const esc = (s) => String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  // ---- Fotos ---------------------------------------------------------
  // La tapa la trae Discogs; el vendedor suma las de su ejemplar y decide
  // cual va primera, que es la que se ve en el catalogo y en la placa.
  const fotos = ((editRec && editRec.photos) || []).map((u) => ({ tipo: "guardada", url: u }));

  function renderFotos() {
    const box = document.getElementById("fotos-box");
    if (!box) return;
    box.innerHTML = fotos.map((f, i) => `
      <div style="position:relative;width:80px">
        <img src="${f.url}" data-i="${i}" class="foto-mini" title="Tocala para ponerla primera"
          style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;display:block;border:2px solid ${i === 0 ? "var(--acc)" : "#e3ded7"}">
        ${i === 0 ? `<span style="position:absolute;bottom:4px;left:4px;background:var(--acc);color:#fff;font-size:9px;padding:1px 6px;border-radius:20px">Principal</span>` : ""}
        <button type="button" class="foto-del" data-i="${i}" title="Sacar esta foto"
          style="position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;border:0;background:#16130f;color:#fff;cursor:pointer;line-height:1;font-size:12px;padding:0">✕</button>
      </div>`).join("");

    box.querySelectorAll(".foto-mini").forEach((im) => im.onclick = () => {
      const i = Number(im.dataset.i);
      if (i === 0) return;
      fotos.unshift(fotos.splice(i, 1)[0]);
      renderFotos();
    });
    box.querySelectorAll(".foto-del").forEach((b) => b.onclick = () => {
      fotos.splice(Number(b.dataset.i), 1);
      renderFotos();
    });
  }

  document.getElementById("fotos").onchange = (e) => {
    for (const file of [...e.target.files]) {
      if (fotos.length >= 4) break;
      fotos.push({ tipo: "archivo", file, url: URL.createObjectURL(file) });
    }
    e.target.value = "";
    renderFotos();
  };

  renderFotos();

  document.getElementById("btn-add-track").onclick = () => {
    tracks.push({ position: "", title: "", duration: "", audio_url: "" });
    renderTracks();
  };
  renderTracks();

  // Autocompletar desde Discogs
  document.getElementById("btn-dg").onclick = async () => {
    const btn = document.getElementById("btn-dg");
    const hint = document.getElementById("dg-hint");
    const link = document.getElementById("dg-url").value.trim();
    if (!link) return toast("Pegá primero el link de Discogs", true);
    btn.disabled = true; btn.textContent = "Buscando…";
    try {
        // Primero desde el navegador. Discogs limita por direccion de
        // internet, y la del servidor la comparten miles de sitios: por eso
        // la cuota aparecia siempre agotada aunque nadie usara SURCOGS.
        let j;
        try {
          j = await traerDeDiscogs(link);
        } catch (falloNavegador) {
          // Si el navegador no pudo, probamos por el servidor antes de
          // darnos por vencidos.
          const r = await fetch("/api/discogs?url=" + encodeURIComponent(link),
            { headers: await authHeaders() });
          const alt = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(alt.error || falloNavegador.message);
          j = alt;
        }
      document.getElementById("artist").value = j.artist || "";
      document.getElementById("title").value = j.title || "";
      document.getElementById("label").value = j.label || "";
      if (j.year) document.getElementById("year").value = j.year;
      document.getElementById("format").value = j.format || '12"';
      // La tapa entra primera. La mostramos por nuestro proxy porque
      // i.discogs.com no habilita CORS, y esa misma URL nos sirve
      // despues para bajarla y guardarla como foto propia.
      if (j.cover) {
        const yaEsta = fotos.findIndex((f) => f.tipo === "discogs");
        if (yaEsta >= 0) fotos.splice(yaEsta, 1);
        fotos.unshift({ tipo: "discogs", url: "/api/tapa?u=" + encodeURIComponent(j.cover) });
        if (fotos.length > 4) fotos.length = 4;
        renderFotos();
      }
      // Mapear el estilo de Discogs a nuestros géneros
      const generos = ["Techno", "House", "Electro", "Minimal"];
      const match = (j.genres || []).map(g => generos.find(x => g.toLowerCase().includes(x.toLowerCase()))).find(Boolean);
      document.getElementById("genre").value = match || "Otro";
      if (j.tracks?.length) {
        tracks = j.tracks.map(t => ({ ...t }));
        renderTracks();
      }
      const conAudio = (j.tracks || []).filter(t => t.audio_url).length;
      const avisoAudio = conAudio
        ? ` 🎧 <b>${conAudio} de ${j.tracks.length} temas ya quedaron con audio</b>, traídos de Discogs. Los que falten, cargalos con el botón de YouTube.`
        : "";
      hint.innerHTML = (j.from_master
        ? `✓ Trajimos la EDICIÓN PRINCIPAL de ese disco${j.year ? " (" + j.year + ")" : ""} — verificá que sea la tuya (sello, año, país) y corregí lo que haga falta.`
        : `✓ Datos traídos de Discogs${j.genres?.length ? " · " + j.genres.join(", ") : ""}. Revisalos, completá estado, precio y TUS fotos.`) + avisoAudio;
      toast(conAudio ? `¡Listo! ${conAudio} temas con audio incluido` : "¡Datos completados desde Discogs!");
    } catch (e) {
      toast(e.message, true);
    }
    btn.disabled = false; btn.textContent = "Traer datos";
  };

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-pub");
    btn.disabled = true; btn.textContent = "Publicando…";
    try {
      // subir fotos
      // En el orden que dejo el vendedor. La tapa de Discogs la bajamos y
      // la guardamos como propia: si manana cambian el link, la
      // publicacion no se queda sin imagen.
      const photos = [];
      for (const f of fotos.slice(0, 4)) {
        if (f.tipo === "guardada") { photos.push(f.url); continue; }
        let archivo = f.file;
        if (!archivo) {
          const resp = await fetch(f.url);
          if (!resp.ok) continue;
          const blob = await resp.blob();
          archivo = new File([blob], "tapa.jpg", { type: blob.type || "image/jpeg" });
        }
        const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase();
        const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
        const { error } = await sb.storage.from("records").upload(path, archivo);
        if (error) throw error;
        photos.push(sb.storage.from("records").getPublicUrl(path).data.publicUrl);
      }
      const v = (id) => document.getElementById(id).value.trim();
      const datos = {
        artist: v("artist"), title: v("title"),
        label: v("label") || null,
        year: v("year") ? Number(v("year")) : null,
        format: v("format"), price: Number(v("price")),
        genre: v("genre"),
        condition_media: v("cm"), condition_sleeve: v("cm"),   // se guarda igual: la tapa ya no se pide
        zona: v("zona") || null, localidad: v("loc") || null,
        envio_coordinar: true,
        envio_correo: false,
        description: v("desc") || null,
        tracks: tracks.filter(t => (t.title || "").trim()).map(t => ({
          position: (t.position || "").trim(),
          title: t.title.trim(),
          duration: (t.duration || "").trim(),
          audio_url: (t.audio_url || "").trim() || null,
        })),
      };
      datos.photos = photos;
      // guardar la dirección de retiro en el perfil (la usa el courier)
      const dirRetiro = v("dir"), cpRetiro = v("cp");
      if ((dirRetiro && dirRetiro !== perfil.direccion) || (cpRetiro && cpRetiro !== perfil.cp)) {
        await sb.from("profiles").update({ direccion: dirRetiro || null, cp: cpRetiro || null }).eq("id", user.id);
      }

      let error;
      if (editRec) {
        // Si baja el precio, guardar el anterior para mostrarlo tachado
        datos.old_price = datos.price < editRec.price ? editRec.price : null;
        ({ error } = await sb.from("records").update(datos).eq("id", editRec.id));
      } else {
        datos.seller_id = user.id;
        if (!datos.photos) datos.photos = [];
        ({ error } = await sb.from("records").insert(datos));
      }
      if (error) throw error;
      toast(editRec ? "¡Cambios guardados!" : "¡Disco publicado!");
      setTimeout(() => location.href = editRec ? "/perfil.html?id=" + user.id : "/cuenta.html", 900);
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false; btn.textContent = "Publicar";
    }
  };
}
init();
</script>
</body>
</html>
