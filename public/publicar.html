<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Publicar disco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, GRADOS, toast, fmtPrecio, precioComprador } from "/js/app.js";
renderHeader("publicar");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés publicar.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) { location.href = "/cuenta.html"; return; }
  const perfil = await getPerfil(user.id);
  if (!perfil) { location.href = "/cuenta.html"; return; }

  // Requisito para vender: Mercado Pago conectado (así el comprador paga online y la comisión se descuenta sola)
  if (!perfil.mp_connected) {
    main.innerHTML = `
      <h1>Un paso antes de publicar</h1>
      <p class="sub">Conectá tu cuenta de Mercado Pago para recibir los pagos directo. Es una sola vez, tarda un minuto y no tiene costo.</p>
      <div class="panel">
        <strong>¿Por qué?</strong>
        <p class="hint" style="margin:6px 0 14px">Los compradores pagan online con protección de Mercado Pago y la plata te llega a tu cuenta al instante. La comisión de SURCOGS (0% tus primeros 30 días, después 10%) se descuenta sola: nunca ponés plata de tu bolsillo.</p>
        <button class="btn" id="btn-mp">Conectar Mercado Pago</button>
      </div>`;
    document.getElementById("btn-mp").onclick = async () => {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch("/api/mp-oauth-start?next=/publicar.html", {
        headers: { Authorization: "Bearer " + session.access_token },
      });
      const j = await r.json();
      if (j.url) location.href = j.url; else toast(j.error || "Error", true);
    };
    return;
  }

  main.innerHTML = `
    <h1>Publicar un disco</h1>
    <p class="sub">Gratis. Cobrás vos, la comisión se descuenta sola al vender (0% tus primeros 30 días).</p>
    <form class="panel" id="f">
      <label>¿Está en Discogs? Pegá el link y completamos todo</label>
      <div style="display:flex;gap:8px">
        <input id="dg-url" placeholder="https://www.discogs.com/release/…" style="flex:1">
        <button class="btn small" type="button" id="btn-dg">Traer datos</button>
      </div>
      <p class="hint" id="dg-hint">Autocompleta artista, título, sello, año y formato. Las fotos siempre son de TU ejemplar.</p>
      <div class="divider"><span>datos del disco</span></div>
      <div class="row2">
        <div><label>Artista *</label><input id="artist" required></div>
        <div><label>Título *</label><input id="title" required></div>
      </div>
      <div class="row2">
        <div><label>Sello</label><input id="label" placeholder="Purpose Maker"></div>
        <div><label>Año</label><input id="year" type="number" min="1940" max="2030"></div>
      </div>
      <div class="row2">
        <div><label>Formato</label>
          <select id="format"><option>12"</option><option>2×12"</option><option>7"</option><option>10"</option><option>LP</option><option>2×LP</option></select>
        </div>
        <div><label>Lo que vas a recibir (ARS) *</label><input id="price" type="number" min="1" required></div>
      </div>
      <p class="hint" id="hint-precio">Ponés lo que querés cobrar vos. Las comisiones se suman arriba y las paga el comprador.</p>
      <div class="row2">
        <div><label>Estado del vinilo *</label>
          <select id="cm">${GRADOS.map(g => `<option ${g === "VG+" ? "selected" : ""}>${g}</option>`).join("")}</select>
        </div>
        <div><label>Estado de la tapa *</label>
          <select id="cs">${GRADOS.map(g => `<option ${g === "VG+" ? "selected" : ""}>${g}</option>`).join("")}</select>
        </div>
      </div>
      <p class="hint">Goldmine: NM casi perfecto · VG+ uso leve · VG uso evidente · G ruido considerable. Ante la duda, poné el grado más bajo.</p>
      <label>Zona de entrega</label><input id="zona" value="${perfil.zona || ""}">
      <label>Temas (se completan solos desde Discogs, o cargalos a mano)</label>
      <div id="tracks-box"></div>
      <button type="button" class="btn small ghost" id="btn-add-track">+ Agregar tema</button>
      <label>Audio de referencia general (opcional, link de YouTube)</label><input id="audio" placeholder="https://youtube.com/watch?v=…">
      <label>Fotos (hasta 4 — tapa, vinilo, etiqueta)</label>
      <input id="fotos" type="file" accept="image/*" multiple>
      <label>Notas (opcional)</label><textarea id="desc" placeholder="Warp leve que no afecta reproducción, edición original US…"></textarea>
      <br><button class="btn" type="submit" id="btn-pub">Publicar</button>
    </form>`;

  // ---- Tracklist con audio por tema ----
  let tracks = [];
  function renderTracks() {
    const box = document.getElementById("tracks-box");
    box.innerHTML = tracks.map((t, i) => `
      <div style="border:1px solid var(--line);border-radius:2px;padding:10px;margin-bottom:8px">
        <div style="display:flex;gap:8px">
          <input data-i="${i}" data-k="position" value="${esc(t.position)}" placeholder="A1" style="width:64px">
          <input data-i="${i}" data-k="title" value="${esc(t.title)}" placeholder="Título del tema" style="flex:1">
          <button type="button" class="btn small ghost btn-del-track" data-i="${i}">✕</button>
        </div>
        <input data-i="${i}" data-k="audio_url" value="${esc(t.audio_url || "")}"
          placeholder="Link de audio del tema (YouTube, Bandcamp o SoundCloud)" style="margin-top:6px">
      </div>`).join("") || `<p class="hint">Sin temas cargados. Traelos desde Discogs o agregalos a mano.</p>`;

    box.querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => {
      tracks[Number(inp.dataset.i)][inp.dataset.k] = inp.value;
    });
    box.querySelectorAll(".btn-del-track").forEach(b => b.onclick = () => {
      tracks.splice(Number(b.dataset.i), 1); renderTracks();
    });
  }
  const esc = (s) => String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  document.getElementById("btn-add-track").onclick = () => {
    tracks.push({ position: "", title: "", duration: "", audio_url: "" });
    renderTracks();
  };
  renderTracks();

  // Autocompletar desde Discogs
  document.getElementById("btn-dg").onclick = async () => {
    const btn = document.getElementById("btn-dg");
    const hint = document.getElementById("dg-hint");
    const link = document.getElementById("dg-url").value.trim();
    if (!link) return toast("Pegá primero el link de Discogs", true);
    btn.disabled = true; btn.textContent = "Buscando…";
    try {
      const r = await fetch("/api/discogs?url=" + encodeURIComponent(link));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Error");
      document.getElementById("artist").value = j.artist || "";
      document.getElementById("title").value = j.title || "";
      document.getElementById("label").value = j.label || "";
      if (j.year) document.getElementById("year").value = j.year;
      document.getElementById("format").value = j.format || '12"';
      if (j.tracks?.length) {
        tracks = j.tracks.map(t => ({ ...t, audio_url: "" }));
        renderTracks();
      }
      hint.textContent = j.from_master
        ? `✓ Trajimos la EDICIÓN PRINCIPAL de ese disco${j.year ? " (" + j.year + ")" : ""} — verificá que sea la tuya (sello, año, país) y corregí lo que haga falta.`
        : `✓ Datos traídos de Discogs${j.genres?.length ? " · " + j.genres.join(", ") : ""}. Revisalos, completá estado, precio y TUS fotos.`;
      toast("¡Datos completados desde Discogs!");
    } catch (e) {
      toast(e.message, true);
    }
    btn.disabled = false; btn.textContent = "Traer datos";
  };

  // Mostrar en vivo el precio final que ve el comprador
  document.getElementById("price").addEventListener("input", (e) => {
    const n = Number(e.target.value);
    document.getElementById("hint-precio").textContent = n > 0
      ? `Vos recibís ${fmtPrecio(n)} → el comprador va a ver ${fmtPrecio(precioComprador(n))} (comisiones incluidas).`
      : "Ponés lo que querés cobrar vos. Las comisiones se suman arriba y las paga el comprador.";
  });

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-pub");
    btn.disabled = true; btn.textContent = "Publicando…";
    try {
      // subir fotos
      const files = [...document.getElementById("fotos").files].slice(0, 4);
      const photos = [];
      for (const f of files) {
        const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${f.name.split(".").pop()}`;
        const { error } = await sb.storage.from("records").upload(path, f);
        if (error) throw error;
        photos.push(sb.storage.from("records").getPublicUrl(path).data.publicUrl);
      }
      const v = (id) => document.getElementById(id).value.trim();
      const { error } = await sb.from("records").insert({
        seller_id: user.id,
        artist: v("artist"), title: v("title"),
        label: v("label") || null,
        year: v("year") ? Number(v("year")) : null,
        format: v("format"), price: Number(v("price")),
        condition_media: v("cm"), condition_sleeve: v("cs"),
        zona: v("zona") || null, audio_url: v("audio") || null,
        description: v("desc") || null, photos,
        tracks: tracks.filter(t => (t.title || "").trim()).map(t => ({
          position: (t.position || "").trim(),
          title: t.title.trim(),
          duration: (t.duration || "").trim(),
          audio_url: (t.audio_url || "").trim() || null,
        })),
      });
      if (error) throw error;
      toast("¡Disco publicado!");
      setTimeout(() => location.href = "/cuenta.html", 900);
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false; btn.textContent = "Publicar";
    }
  };
}
init();
</script>
</body>
</html>
