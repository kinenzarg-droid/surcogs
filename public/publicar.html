<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Publicar disco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>.wrap{max-width:700px}.wrap form.panel,.wrap .panel{max-width:none}</style>
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, GRADOS, toast, fmtPrecio, precioComprador, ADMIN_ID, zonaSelector } from "/js/app.js";
renderHeader("publicar");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés publicar.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) { location.href = "/cuenta.html"; return; }
  const perfil = await getPerfil(user.id);
  if (!perfil) { location.href = "/cuenta.html"; return; }

  // Requisito para vender: Mercado Pago conectado (así el comprador paga online y la comisión se descuenta sola)
  if (!perfil.mp_connected) {
    main.innerHTML = `
      <h1>Un paso antes de publicar</h1>
      <p class="sub">Conectá tu cuenta de Mercado Pago para recibir los pagos directo. Es una sola vez, tarda un minuto y no tiene costo.</p>
      <div class="panel">
        <strong>¿Por qué?</strong>
        <p class="hint" style="margin:6px 0 14px">Los compradores pagan online con protección de Mercado Pago y la plata te llega a tu cuenta. El comprador ve tu precio más la comisión de SURCOGS y Mercado Pago: nunca ponés plata de tu bolsillo.</p>
        <button class="btn" id="btn-mp">Conectar Mercado Pago</button>
      </div>`;
    document.getElementById("btn-mp").onclick = async () => {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch("/api/mp-oauth-start?next=/publicar.html", {
        headers: { Authorization: "Bearer " + session.access_token },
      });
      const j = await r.json();
      if (j.url) location.href = j.url; else toast(j.error || "Error", true);
    };
    return;
  }

  // ¿Modo edición?
  const editId = new URLSearchParams(location.search).get("edit");
  let editRec = null;
  if (editId) {
    const { data } = await sb.from("records").select("*").eq("id", editId).maybeSingle();
    const puedeEditar = data && (data.seller_id === user.id || user.id === ADMIN_ID);
    if (!puedeEditar) { toast("No encontramos ese disco entre los tuyos", true); location.href = "/perfil.html?id=" + user.id; return; }
    editRec = data;
  }

  main.innerHTML = `
    <h1>${editRec ? "Editar disco" : "Publicar un disco"}</h1>
    <p class="sub">${editRec ? "Cambiá lo que necesites y guardá. Si bajás el precio, el anterior queda tachado en el catálogo." : "Publicar es gratis. La comisión se descuenta sola al vender."}</p>
    <form class="panel" id="f">
      <label>¿Está en Discogs? Pegá el link y completamos todo</label>
      <div style="display:flex;gap:8px">
        <input id="dg-url" placeholder="https://www.discogs.com/release/…" style="flex:1">
        <button class="btn small" type="button" id="btn-dg">Traer datos</button>
      </div>
      <p class="hint" id="dg-hint">Autocompleta artista, título, sello, año y formato. Las fotos siempre son de TU ejemplar.</p>
      <div class="divider"><span>datos del disco</span></div>
      <div class="row2">
        <div><label>Artista *</label><input id="artist" required></div>
        <div><label>Título *</label><input id="title" required></div>
      </div>
      <div class="row2">
        <div><label>Sello</label><input id="label" placeholder="Purpose Maker"></div>
        <div><label>Año</label><input id="year" type="number" min="1940" max="2030"></div>
      </div>
      <div class="row2">
        <div><label>Género *</label>
          <select id="genre">
            <option>Techno</option><option>House</option><option>Electro</option>
            <option>Minimal</option><option>Otro</option>
          </select>
        </div>
        <div></div>
      </div>
      <div class="row2">
        <div><label>Formato</label>
          <select id="format"><option>12"</option><option>2×12"</option><option>7"</option><option>10"</option><option>LP</option><option>2×LP</option></select>
        </div>
        <div><label>Precio recibido *</label>
          <div style="position:relative">
            <span style="position:absolute;left:11px;top:9px;color:var(--dim);font-size:13.5px">$</span>
            <input id="price" type="number" min="1" placeholder="0" required style="padding-left:24px">
          </div>
        </div>
      </div>
      <div class="row2">
        <div><label>Estado del vinilo *</label>
          <select id="cm">${GRADOS.map(g => `<option ${g === "VG+" ? "selected" : ""}>${g}</option>`).join("")}</select>
        </div>
        <div><label>Estado de la tapa *</label>
          <select id="cs">${GRADOS.map(g => `<option ${g === "VG+" ? "selected" : ""}>${g}</option>`).join("")}</select>
        </div>
      </div>
      <p class="hint">Goldmine: NM casi perfecto · VG+ uso leve · VG uso evidente · G ruido considerable. Ante la duda, poné el grado más bajo.</p>
      <div class="row2">
        <div><label>Zona</label><select id="zona"></select></div>
        <div><label>Localidad / barrio</label><input id="loc"></div>
      </div>
      <div class="row2">
        <div><label>Entrega *</label>
          <select id="entrega">
            <option value="coordinar">A coordinar con el comprador</option>
            <option value="fijo">Envío con costo fijo a todo el país</option>
            <option value="gratis">Envío gratis (lo absorbo yo)</option>
            <option value="retiro">Solo retiro en mano (mi zona)</option>
          </select>
        </div>
        <div id="env-box" style="display:none"><label>Costo del envío</label>
          <input id="env-costo" type="number" min="0" placeholder="5500">
        </div>
      </div>
      <p class="hint">Si elegís costo fijo, el comprador lo ve antes de pagar y vos lo recibís completo junto con tu precio. Referencia: un vinilo embalado por Correo Argentino a sucursal ronda los $5.000-8.000. Comprando varios discos tuyos se cobra un solo envío (el más caro).</p>
      <label>Temas (se completan solos desde Discogs, o cargalos a mano)</label>
      <div id="tracks-box"></div>
      <p class="hint">Con los botones buscás el tema ya escrito en cada plataforma: elegí el que suene bien, copiá el link y pegalo. Así los compradores lo escuchan sin salir de tu publicación.</p>
      <button type="button" class="btn small ghost" id="btn-add-track">+ Agregar tema</button>
      <label>Audio de referencia general (opcional, link de YouTube)</label><input id="audio" placeholder="https://youtube.com/watch?v=…">
      <label>Fotos (hasta 4 — tapa, vinilo, etiqueta)</label>
      <input id="fotos" type="file" accept="image/*" multiple>
      <label>Notas (opcional)</label><textarea id="desc" placeholder="Warp leve que no afecta reproducción, edición original US…"></textarea>
      <br><button class="btn" type="submit" id="btn-pub">${editRec ? "Guardar cambios" : "Publicar"}</button>
    </form>`;

  // Entrega: mostrar el costo solo si es envío fijo
  const selEntrega = document.getElementById("entrega");
  const envBox = document.getElementById("env-box");
  selEntrega.onchange = () => { envBox.style.display = selEntrega.value === "fijo" ? "block" : "none"; };

  // Zona → localidad: hereda la del perfil (o la del disco en modo edición)
  zonaSelector(document.getElementById("zona"), document.getElementById("loc"),
    editRec ? (editRec.zona || "") : (perfil.zona || ""),
    editRec ? (editRec.localidad || "") : (perfil.localidad || ""));

  // Precargar datos en modo edición
  if (editRec) {
    const set = (id, v) => { if (v !== null && v !== undefined) document.getElementById(id).value = v; };
    set("artist", editRec.artist); set("title", editRec.title); set("label", editRec.label);
    set("year", editRec.year); set("format", editRec.format); set("price", editRec.price);
    set("genre", editRec.genre || "Techno");
    set("cm", editRec.condition_media); set("cs", editRec.condition_sleeve);
    set("audio", editRec.audio_url); set("desc", editRec.description);
    set("entrega", editRec.shipping_mode || "coordinar");
    set("env-costo", editRec.shipping_cost);
    envBox.style.display = (editRec.shipping_mode === "fijo") ? "block" : "none";
  }

  // ---- Tracklist con audio por tema ----
  let tracks = editRec?.tracks?.length ? editRec.tracks.map(t => ({ ...t })) : [];
  function renderTracks() {
    const box = document.getElementById("tracks-box");
    box.innerHTML = tracks.map((t, i) => `
      <div style="border:1px solid var(--line);border-radius:2px;padding:10px;margin-bottom:8px">
        <div style="display:flex;gap:8px">
          <input data-i="${i}" data-k="position" value="${esc(t.position)}" placeholder="A1" style="width:64px">
          <input data-i="${i}" data-k="title" value="${esc(t.title)}" placeholder="Título del tema" style="flex:1">
          <button type="button" class="btn small ghost btn-del-track" data-i="${i}">✕</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
          <input data-i="${i}" data-k="audio_url" value="${esc(t.audio_url || "")}"
            placeholder="Pegá acá el link del tema" style="flex:1;min-width:180px">
          <button type="button" class="btn small ghost btn-buscar" data-i="${i}" data-p="yt">YouTube</button>
          <button type="button" class="btn small ghost btn-buscar" data-i="${i}" data-p="sc">SoundCloud</button>
          <button type="button" class="btn small ghost btn-buscar" data-i="${i}" data-p="sp">Spotify</button>
        </div>
      </div>`).join("") || `<p class="hint">Sin temas cargados. Traelos desde Discogs o agregalos a mano.</p>`;

    box.querySelectorAll(".btn-buscar").forEach(b => b.onclick = () => {
      const t = tracks[Number(b.dataset.i)];
      const q = encodeURIComponent(((document.getElementById("artist").value || "") + " " + (t.title || "")).trim());
      const urls = {
        yt: "https://www.youtube.com/results?search_query=" + q,
        sc: "https://soundcloud.com/search?q=" + q,
        sp: "https://open.spotify.com/search/" + q,
      };
      window.open(urls[b.dataset.p], "_blank");
    });

    box.querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => {
      tracks[Number(inp.dataset.i)][inp.dataset.k] = inp.value;
    });
    box.querySelectorAll(".btn-del-track").forEach(b => b.onclick = () => {
      tracks.splice(Number(b.dataset.i), 1); renderTracks();
    });
  }
  const esc = (s) => String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  document.getElementById("btn-add-track").onclick = () => {
    tracks.push({ position: "", title: "", duration: "", audio_url: "" });
    renderTracks();
  };
  renderTracks();

  // Autocompletar desde Discogs
  document.getElementById("btn-dg").onclick = async () => {
    const btn = document.getElementById("btn-dg");
    const hint = document.getElementById("dg-hint");
    const link = document.getElementById("dg-url").value.trim();
    if (!link) return toast("Pegá primero el link de Discogs", true);
    btn.disabled = true; btn.textContent = "Buscando…";
    try {
      const r = await fetch("/api/discogs?url=" + encodeURIComponent(link));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Error");
      document.getElementById("artist").value = j.artist || "";
      document.getElementById("title").value = j.title || "";
      document.getElementById("label").value = j.label || "";
      if (j.year) document.getElementById("year").value = j.year;
      document.getElementById("format").value = j.format || '12"';
      // Mapear el estilo de Discogs a nuestros géneros
      const generos = ["Techno", "House", "Electro", "Minimal"];
      const match = (j.genres || []).map(g => generos.find(x => g.toLowerCase().includes(x.toLowerCase()))).find(Boolean);
      document.getElementById("genre").value = match || "Otro";
      if (j.tracks?.length) {
        tracks = j.tracks.map(t => ({ ...t, audio_url: "" }));
        renderTracks();
      }
      hint.textContent = j.from_master
        ? `✓ Trajimos la EDICIÓN PRINCIPAL de ese disco${j.year ? " (" + j.year + ")" : ""} — verificá que sea la tuya (sello, año, país) y corregí lo que haga falta.`
        : `✓ Datos traídos de Discogs${j.genres?.length ? " · " + j.genres.join(", ") : ""}. Revisalos, completá estado, precio y TUS fotos.`;
      toast("¡Datos completados desde Discogs!");
    } catch (e) {
      toast(e.message, true);
    }
    btn.disabled = false; btn.textContent = "Traer datos";
  };

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-pub");
    btn.disabled = true; btn.textContent = "Publicando…";
    try {
      // subir fotos
      const files = [...document.getElementById("fotos").files].slice(0, 4);
      const photos = [];
      for (const f of files) {
        const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${f.name.split(".").pop()}`;
        const { error } = await sb.storage.from("records").upload(path, f);
        if (error) throw error;
        photos.push(sb.storage.from("records").getPublicUrl(path).data.publicUrl);
      }
      const v = (id) => document.getElementById(id).value.trim();
      const datos = {
        artist: v("artist"), title: v("title"),
        label: v("label") || null,
        year: v("year") ? Number(v("year")) : null,
        format: v("format"), price: Number(v("price")),
        genre: v("genre"),
        condition_media: v("cm"), condition_sleeve: v("cs"),
        zona: v("zona") || null, localidad: v("loc") || null, audio_url: v("audio") || null,
        shipping_mode: v("entrega") || "coordinar",
        shipping_cost: v("entrega") === "fijo" ? Number(v("env-costo")) || null : null,
        description: v("desc") || null,
        tracks: tracks.filter(t => (t.title || "").trim()).map(t => ({
          position: (t.position || "").trim(),
          title: t.title.trim(),
          duration: (t.duration || "").trim(),
          audio_url: (t.audio_url || "").trim() || null,
        })),
      };
      if (photos.length) datos.photos = photos;

      let error;
      if (editRec) {
        // Si baja el precio, guardar el anterior para mostrarlo tachado
        datos.old_price = datos.price < editRec.price ? editRec.price : null;
        ({ error } = await sb.from("records").update(datos).eq("id", editRec.id));
      } else {
        datos.seller_id = user.id;
        if (!datos.photos) datos.photos = [];
        ({ error } = await sb.from("records").insert(datos));
      }
      if (error) throw error;
      toast(editRec ? "¡Cambios guardados!" : "¡Disco publicado!");
      setTimeout(() => location.href = editRec ? "/perfil.html?id=" + user.id : "/cuenta.html", 900);
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false; btn.textContent = "Publicar";
    }
  };
}
init();
</script>
</body>
</html>
