<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Liquidaciones</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
.lq{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:#fff}
.card.go{border-color:#2ea860;background:#f5fbf7}
.mt{font-size:20px;font-weight:700}
.al{font-family:ui-monospace,monospace;background:#f1f1f1;border-radius:4px;padding:3px 8px;font-size:13px;
  cursor:pointer;display:inline-block}
.st{font-size:12px;color:var(--dim);margin-top:4px}
h2{margin:26px 0 10px;font-size:16px}
</style>
</head>
<body>
<div class="lq">
  <h1 style="margin-bottom:4px">Liquidaciones</h1>
  <p class="sub" id="sub">A quién le tengo que transferir.</p>
  <div id="out"></div>
</div>

<script type="module">
import { getUser, authHeaders, ADMIN_ID } from "/js/app.js?v=3";
const out = document.getElementById("out");
const pesos = (n) => "$" + Number(n || 0).toLocaleString("es-AR");
const fecha = (d) => d ? new Date(d).toLocaleDateString("es-AR") : "—";

const card = (o, go) => `
  <div class="card ${go ? "go" : ""}">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:200px">
        <b>${o.artist} – ${o.title}</b>
        <div class="st">${o.vendedor || "vendedor"} · ${o.metodo_pago} · ${go
          ? (o.entregado_at ? "confirmó la entrega el " + fecha(o.entregado_at) : "pasaron 10 días")
          : "esperando confirmación del comprador"}</div>
        <div style="margin-top:7px">
          ${o.vendedor_alias
            ? `<span class="al" data-alias="${o.vendedor_alias}" onclick="copiar(this)">${o.vendedor_alias}</span>`
            : `<span style="color:var(--err);font-size:13px">⚠ el vendedor no cargó su alias</span>`}
          ${o.vendedor_titular ? `<span class="st"> · ${o.vendedor_titular}</span>` : ""}
        </div>
      </div>
      <div style="text-align:right">
        <div class="mt">${pesos(o.monto_vendedor)}</div>
        ${go ? `<button class="btn small" onclick="pagar('${o.id}',this)">Ya le transferí</button>` : ""}
      </div>
    </div>
  </div>`;

// Compras por transferencia que todavía no cobré. Hasta que no confirme,
// el disco sigue reservado y a las 24hs volvería al catálogo.
const cardReserva = (g) => `
  <div class="card" style="border-color:#e0a300;background:#fffdf5">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:200px">
        <b>${g.discos.join(" · ")}</b>
        <div class="st">${g.buyer_name || g.buyer_email || "sin datos del comprador"} ·
          reservado el ${fecha(g.created_at)} · código SC-${g.purchase_id.slice(0,4).toUpperCase()}</div>
      </div>
      <div style="text-align:right">
        <div class="mt">${pesos(g.total)}</div>
        <button class="btn small" onclick="cobrado('${g.purchase_id}',this)">Ya me transfirió</button>
      </div>
    </div>
  </div>`;

async function cobrado(purchase_id, btn) {
  if (!confirm("¿Confirmás que la plata ya entró? El disco pasa a vendido y le avisamos al comprador y al vendedor.")) return;
  btn.disabled = true; btn.textContent = "Confirmando…";
  const r = await fetch("/api/liquidaciones", {
    method: "POST",
    headers: await authHeaders(),
    body: JSON.stringify({ purchase_id }),
  });
  r.ok ? cargar() : (btn.disabled = false, btn.textContent = "Ya me transfirió");
}

async function cargar() {
  const r = await fetch("/api/liquidaciones", { headers: await authHeaders() });
  const j = await r.json();
  if (!r.ok) return out.innerHTML = `<p class="sub">${j.error}</p>`;
  const total = j.liberables.reduce((s, o) => s + Number(o.monto_vendedor || 0), 0);
  document.getElementById("sub").innerHTML =
    `Tenés <b>${j.liberables.length}</b> transferencia${j.liberables.length === 1 ? "" : "s"} para hacer por <b>${pesos(total)}</b>.`;
  out.innerHTML =
    `<h2>Transferencias por cobrar (${j.reservas.length})</h2>` +
    (j.reservas.map(cardReserva).join("") || "<p class='sub'>Ninguna esperando.</p>") +
    `<h2>Para transferir ya (${j.liberables.length})</h2>` +
    (j.liberables.map(o => card(o, true)).join("") || "<p class='sub'>Nada pendiente. 👌</p>") +
    `<h2>Esperando confirmación (${j.esperando.length})</h2>` +
    (j.esperando.map(o => card(o, false)).join("") || "<p class='sub'>Nada en curso.</p>") +
    `<h2>Últimas liquidadas</h2>` +
    (j.liquidadas.map(o => `<div class="card">
        <b>${o.vendedor || "vendedor"}</b> · ${pesos(o.monto_vendedor)}
        <div style="margin-top:6px">${o.vendedor_alias
          ? `<span class="al" data-alias="${o.vendedor_alias}" onclick="copiar(this)">${o.vendedor_alias}</span>`
          : `<span class="st">sin alias</span>`}</div>
        <div class="st">Transferido el ${fecha(o.liquidado_at)}</div>
      </div>`).join("")
      || "<p class='sub'>Todavía ninguna.</p>");
}

async function pagar(id, btn) {
  if (!confirm("¿Confirmás que ya le transferiste al vendedor?")) return;
  btn.disabled = true; btn.textContent = "Guardando…";
  const r = await fetch("/api/liquidaciones", {
    method: "POST",
    headers: await authHeaders(),
    body: JSON.stringify({ id }),
  });
  r.ok ? cargar() : (btn.disabled = false, btn.textContent = "Ya le transferí");
}

// Copia el alias sin hacerlo desaparecer: hace falta tenerlo a la vista para
// pegarlo en el homebanking, así que el "copiado" se muestra al lado y se va solo.
window.copiar = (el) => {
  const alias = el.dataset.alias;
  navigator.clipboard.writeText(alias);
  el.textContent = alias + "  copiado ✓";
  setTimeout(() => { el.textContent = alias; }, 1600);
};

// Los onclick del HTML buscan las funciones en window, pero este script es un
// módulo y tiene su propio scope. Sin esto, los botones no hacen nada.
window.pagar = pagar;
window.cobrado = cobrado;

// Sin sesión de admin no tiene sentido ni pedir los datos.
const user = await getUser();
if (!user) {
  out.innerHTML = `<p class="sub">Entrá con tu cuenta para ver las liquidaciones.</p>
    <a class="btn" href="/cuenta.html" style="margin-top:10px">Ingresar</a>`;
} else if (ADMIN_ID && user.id !== ADMIN_ID) {
  out.innerHTML = `<p class="sub">Esta sección es solo para el administrador.</p>`;
} else {
  cargar();
}
</script>
</body>
</html>
