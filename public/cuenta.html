<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Mi cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="stylesheet" href="/css/style.css">
<style>#compras,#ventas{scroll-margin-top:90px}</style>
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, fmtPrecio, fotoPrincipal, toast, zonaSelector, authHeaders } from "/js/app.js?v=3";
renderHeader("cuenta");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés vender con pago online.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) return renderAuth();
  const perfil = await getPerfil(user.id);
  if (!perfil) return renderCrearPerfil(user);
  renderPanel(user, perfil);
}

/* ---------- LOGIN / REGISTRO ---------- */
const loginGoogle = async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + "/cuenta.html" },
  });
  if (error) toast(error.message, true);
};

function renderAuth() {
  main.innerHTML = `
    <h1>Ingresar</h1>
    <p class="sub">Registrate gratis. Publicar no cuesta nada: SURCOGS cobra una comisión solo cuando vendés.</p>
    <form class="panel" id="f-auth">
      <button class="btn ghost" type="button" id="btn-google" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="17" height="17" viewBox="0 0 48 48" style="pointer-events:none"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.4 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.7-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.6-3.8-13.5-9.1l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>Continuar con Google</button>
      <div class="divider"><span>o con tu email</span></div>
      <label>Email</label><input id="a-email" type="email" required>
      <label>Contraseña</label><input id="a-pass" type="password" minlength="6" required>
      <p style="margin:6px 0 0"><a href="#" id="btn-olvide" style="color:var(--acc);font-size:12.5px">¿Olvidaste tu contraseña?</a></p>
      <br>
      <button class="btn" type="submit">Ingresar</button>
      <button class="btn ghost" type="button" id="btn-reg">Crear cuenta</button>
    </form>

    <!-- Modal: recuperar contraseña -->
    <div class="modal-bg" id="modal-pass" style="display:none">
      <div class="modal">
        <h2 style="margin-bottom:4px">Recuperar contraseña</h2>
        <p class="hint" style="margin-bottom:12px">Poné tu email y te mandamos un link para elegir una nueva.</p>
        <form id="f-pass">
          <label>Email</label><input id="p-mail" type="email" placeholder="tu@email.com" required>
          <br><br>
          <button class="btn" type="submit" id="btn-pass-go">Enviarme el link</button>
          <button class="btn ghost" type="button" id="btn-pass-close">Cancelar</button>
        </form>
        <p id="p-ok" class="hint" style="display:none;margin-top:12px;color:var(--ok)"></p>
      </div>
    </div>

    <!-- Modal de registro -->
    <div class="modal-bg" id="modal-reg" style="display:none">
      <div class="modal">
        <h2 style="margin-bottom:4px">Crear cuenta</h2>
        <p class="hint" style="margin-bottom:10px">Un solo paso y ya podés comprar y vender.</p>
        <button class="btn ghost" type="button" id="btn-google-reg" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="17" height="17" viewBox="0 0 48 48" style="pointer-events:none"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.4 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.7-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.6-3.8-13.5-9.1l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>Registrarme con Google</button>
        <div class="divider"><span>o completá a mano</span></div>
        <form id="f-reg">
          <label>Nombre o alias *</label><input id="r-name" placeholder="Vinyl Store" required>
          <label>Email *</label><input id="r-email" type="email" required>
          <label>Contraseña (mín. 6) *</label><input id="r-pass" type="password" minlength="6" required>
          <label>Repetir contraseña *</label><input id="r-pass2" type="password" minlength="6" required>
          <label>Celular (WhatsApp)</label><input id="r-cel" type="tel" placeholder="11 2345 6789">
          <label>Zona</label><select id="r-zona"></select>
          <label>Localidad / barrio</label><input id="r-loc">
          <br><br>
          <button class="btn" type="submit" id="btn-reg-go">Crear mi cuenta</button>
          <button class="btn ghost" type="button" id="btn-reg-close">Cancelar</button>
        </form>
      </div>
    </div>`;

  const email = () => document.getElementById("a-email").value.trim();
  const pass = () => document.getElementById("a-pass").value;
  const modal = document.getElementById("modal-reg");

  document.getElementById("f-auth").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: email(), password: pass() });
    error ? toast(error.message, true) : init();
  };
  document.getElementById("btn-google").onclick = loginGoogle;

  // Recuperar contraseña
  const mPass = document.getElementById("modal-pass");
  document.getElementById("btn-olvide").onclick = (e) => {
    e.preventDefault();
    document.getElementById("p-mail").value = email();
    mPass.style.display = "flex";
  };
  document.getElementById("btn-pass-close").onclick = () => { mPass.style.display = "none"; };
  mPass.onclick = (e) => { if (e.target === mPass) mPass.style.display = "none"; };
  document.getElementById("f-pass").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-pass-go");
    const mail = document.getElementById("p-mail").value.trim();
    btn.disabled = true; btn.textContent = "Enviando…";
    const { error } = await sb.auth.resetPasswordForEmail(mail, {
      redirectTo: location.origin + "/reset.html",
    });
    btn.disabled = false; btn.textContent = "Enviarme el link";
    if (error) return toast(error.message, true);
    // Mismo mensaje haya o no cuenta con ese mail: no delatamos quién está registrado
    const ok = document.getElementById("p-ok");
    ok.style.display = "block";
    ok.textContent = "Listo. Si ese email tiene cuenta en SURCOGS, te va a llegar el link en un minuto. Revisá también el spam.";
    document.getElementById("f-pass").style.display = "none";
  };
  document.getElementById("btn-google-reg").onclick = loginGoogle;
  zonaSelector(document.getElementById("r-zona"), document.getElementById("r-loc"));
  document.getElementById("btn-reg").onclick = () => { modal.style.display = "flex"; };
  document.getElementById("btn-reg-close").onclick = () => { modal.style.display = "none"; };
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

  // /cuenta.html?registro=1 → abrir directo el formulario de crear cuenta
  if (new URLSearchParams(location.search).get("registro")) modal.style.display = "flex";

  document.getElementById("f-reg").onsubmit = async (e) => {
    e.preventDefault();
    if (document.getElementById("r-pass").value !== document.getElementById("r-pass2").value) {
      return toast("Las contraseñas no coinciden. Revisalas.", true);
    }
    const btn = document.getElementById("btn-reg-go");
    btn.disabled = true; btn.textContent = "Creando…";
    const v = (id) => document.getElementById(id).value.trim();
    const { data, error } = await sb.auth.signUp({ email: v("r-email"), password: document.getElementById("r-pass").value });
    if (error) { toast(error.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    // Crear el perfil en el mismo paso
    if (data.user) {
      const { error: e2 } = await sb.from("profiles").insert({
        id: data.user.id, name: v("r-name"),
        zona: v("r-zona") || null, localidad: v("r-loc") || null,
        whatsapp: v("r-cel") || null,
      });
      if (e2) { toast(e2.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    }
    toast("¡Cuenta creada! Bienvenido a SURCOGS");
    modal.style.display = "none";
    init();
  };
}

/* ---------- PRIMER PERFIL (usuarios de Google) ---------- */
function renderCrearPerfil(user) {
  const sugerido = user.user_metadata?.full_name || user.user_metadata?.name || "";
  main.innerHTML = `
    <h1>Último paso</h1>
    <p class="sub">Confirmá cómo te van a ver los demás y listo.</p>
    <form class="panel" id="f-perfil">
      <label>Nombre o alias</label><input id="p-name" value="${sugerido.replace(/"/g, "&quot;")}" placeholder="Vinyl Store" required>
      <label>Celular (WhatsApp)</label><input id="p-cel" type="tel" placeholder="11 2345 6789">
      <label>Zona</label><select id="p-zona"></select>
      <label>Localidad / barrio</label><input id="p-loc">
      <br><br><button class="btn" type="submit">Guardar y empezar</button>
    </form>`;
  zonaSelector(document.getElementById("p-zona"), document.getElementById("p-loc"));
  document.getElementById("f-perfil").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from("profiles").insert({
      id: user.id,
      name: document.getElementById("p-name").value.trim(),
      whatsapp: document.getElementById("p-cel").value.trim() || null,
      zona: document.getElementById("p-zona").value || null,
      localidad: document.getElementById("p-loc").value || null,
    });
    error ? toast(error.message, true) : location.href = "/publicar.html";
  };
}

/* ---------- PANEL ---------- */
async function renderPanel(user, perfil) {

  const ESTADOS = ["pagada", "enviado", "entregado"];
  const [{ data: discos }, { data: ventas }, { data: compras }] = await Promise.all([
    sb.from("records").select("*").eq("seller_id", user.id).order("created_at", { ascending: false }),
    // Antes filtraba solo por "pagada": al confirmarse la entrega la venta
    // desaparecía de acá justo cuando se completaba.
    sb.from("orders").select("*, records(artist, title)").eq("seller_id", user.id)
      .in("status", ESTADOS).order("created_at", { ascending: false }),
    // Por id de usuario o por mail, para que ande aunque haya cambiado el mail
    sb.from("orders").select("*, records(artist, title)")
      .or(`buyer_id.eq.${user.id},buyer_email.eq.${user.email}`)
      .in("status", [...ESTADOS, "reservado"]).order("created_at", { ascending: false }),
  ]);

  // Qué órdenes ya se calificaron, para no ofrecerlo dos veces
  const ids = [...(ventas || []), ...(compras || [])].map(o => o.id);
  const { data: califs } = ids.length
    ? await sb.from("ratings").select("order_id, tipo").in("order_id", ids)
    : { data: [] };
  const yaCalifico = new Set((califs || []).map(r => r.order_id + "|" + r.tipo));

  // Se puede calificar cuando se confirmó la entrega, o cuando pasaron los
  // 10 días en que la plata se libera igual. Después hay 21 días de plazo.
  const sePuedeCalificar = (o) => {
    const desde = o.entregado_at ? new Date(o.entregado_at)
      : (o.pagado_at ? new Date(new Date(o.pagado_at).getTime() + 10 * 86400000) : null);
    if (!desde) return false;
    const ahora = Date.now();
    return desde.getTime() <= ahora && ahora <= desde.getTime() + 21 * 86400000;
  };

  const iniciales = (perfil.name || "").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "YO";
  main.innerHTML = `
    <h1 style="display:flex;align-items:center;gap:14px">
      <span class="avatar" id="ava-view" style="width:54px;height:54px;font-size:19px;flex:none;display:inline-flex;align-items:center;justify-content:center">
        ${perfil.avatar_url ? `<img src="${perfil.avatar_url}" alt="">` : iniciales}</span>
      <span>Hola, ${perfil.name}</span>
    </h1>
    <p class="sub" style="margin-bottom:16px">${[perfil.zona, perfil.localidad].filter(Boolean).join(" · ") || "Completá tus datos abajo"}
      <input id="ava-file" type="file" accept="image/*" style="display:none"></p>
    <div id="perfil-box"></div>
    <div class="notice">Publicás tu precio y esa plata es tuya. El comprador ve tu precio más la comisión de SURCOGS y Mercado Pago, que se descuentan solas del pago. Nunca ponés plata de tu bolsillo.</div>
    <p style="margin:18px 0"><a class="btn" href="/publicar.html">+ Publicar un disco</a>
      <a class="btn ghost" href="/perfil.html?id=${user.id}" style="margin-left:8px">Ver mi perfil público</a>
      <button class="btn ghost" id="btn-out" style="margin-left:8px">Salir</button></p>
    <div class="mis-discos">
      <h2 style="font-size:18px;margin-bottom:12px">Mis discos (${(discos || []).length})</h2>
      <div id="lista"></div>
    </div>
    <div class="mis-discos" id="compras">
      <h2 style="font-size:18px;margin-bottom:12px">Mis compras (${(compras || []).length})</h2>
      ${(compras || []).map(c => {
        const estado = c.entregado_at ? "✅ Recibido"
          : c.status === "reservado" ? "⏳ Reservado — coordinamos por WhatsApp"
          : "📦 Pagado — esperando la entrega";
        return `
        <div class="list-item">
          <div class="grow">
            <strong>${c.records ? c.records.artist + " – " + c.records.title : "Disco"}</strong><br>
            <span class="hint">${fmtPrecio(c.amount)} · ${new Date(c.created_at).toLocaleDateString("es-AR")} · ${estado}</span>
            <div class="contacto-vend" data-orden="${c.id}"></div>
          </div>
          ${!c.entregado_at && c.rating_token
            ? `<a class="btn small" href="/r.html?o=${c.id}&t=${c.rating_token}">Ya lo recibí</a>`
            : yaCalifico.has(c.id + "|a_vendedor")
              ? `<span class="hint">Ya calificaste ⭐</span>`
              : sePuedeCalificar(c) && c.rating_token
                ? `<a class="btn small ghost" href="/r.html?o=${c.id}&t=${c.rating_token}">Calificar al vendedor</a>`
                : ""}
        </div>`;
      }).join("") || "<p class='sub'>Todavía no compraste nada. <a href='/' style='color:var(--acc)'>Ver el catálogo</a></p>"}
    </div>
    <div class="mis-discos" id="ventas">
      <h2 style="font-size:18px;margin-bottom:12px">Ventas concretadas (${(ventas || []).length})</h2>
      ${(ventas || []).map(v => `
        <div class="list-item">
          <div class="grow">
            <strong>${v.records ? v.records.artist + " – " + v.records.title : "Disco"}</strong><br>
            <span class="hint">${fmtPrecio(v.amount)} · comisión ${fmtPrecio(v.fee)} · ${new Date(v.created_at).toLocaleDateString("es-AR")}
            · ${v.entregado_at ? "✅ Entregado" : "📦 Esperando la entrega"}
            ${v.buyer_email ? " · comprador: " + v.buyer_email : ""}</span>
          </div>
          ${v.buyer_email ? `<a class="btn small" href="mailto:${v.buyer_email}?subject=${encodeURIComponent("Tu compra en SURCOGS")}&body=${encodeURIComponent("¡Hola! Soy " + perfil.name + ", me compraste " + (v.records ? v.records.artist + " – " + v.records.title : "un disco") + " en SURCOGS. ¿Coordinamos la entrega? Puedo ofrecerte punto de encuentro o envío. El disco va embalado en cartón rígido.")}">✉ Contactar</a>` : ""}
        </div>`).join("") || "<p class='sub'>Todavía no tenés ventas.</p>"}
    </div>`;

  // Datos del vendedor en cada compra. Los pide el servidor porque el mail no
  // está en el perfil público, y solo los da si la compra está pagada.
  (async () => {
    const cajas = [...document.querySelectorAll(".contacto-vend")];
    if (!cajas.length) return;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    try {
      const r = await fetch("/api/contacto", {
        method: "POST",
        headers: await authHeaders(),
        body: JSON.stringify({ order_ids: cajas.map(c => c.dataset.orden) }),
      });
      const j = await r.json();
      if (!r.ok || !j.grupos?.length) return;
      // El servidor agrupa por vendedor; acá lo pintamos en cada compra
      const html = j.grupos.map(g => {
        const wa = (g.whatsapp || "").replace(/\D/g, "");
        return `<div style="margin-top:6px;font-size:12.5px">
          <b>${esc(g.nombre)}</b>${g.zona ? ` · <span class="hint">${esc(g.zona)}</span>` : ""}<br>
          ${g.whatsapp ? `<a href="https://wa.me/${wa.startsWith("54") ? wa : "54" + wa}"
            target="_blank" rel="noopener" style="color:var(--acc)">💬 ${esc(g.whatsapp)}</a>` : ""}
          ${g.whatsapp && g.email ? " · " : ""}
          ${g.email ? `<a href="mailto:${esc(g.email)}" style="color:var(--acc)">✉ ${esc(g.email)}</a>` : ""}
          ${!g.whatsapp && !g.email ? `<span class="hint">Sin datos de contacto</span>` : ""}
        </div>`;
      }).join("");
      cajas.forEach(c => { c.innerHTML = html; });
    } catch (_) { /* sin datos de contacto no se rompe nada */ }
  })();

  // ---- Mis datos: qué falta, por qué importa y cómo cargarlo ----
  // Antes esto estaba en tres controles sueltos (un "editar" para la zona, otra
  // caja para el alias, un link para la foto) y la dirección no se podía cargar
  // desde acá. Ahora es una sola lista que muestra qué falta y para qué sirve.
  const perfilBox = document.getElementById("perfil-box");
  const esc = (v) => String(v ?? "").replace(/"/g, "&quot;");

  const CAMPOS = [
    { k: "nombre", tit: "Tu nombre", ico: "🏷",
      por: "Es el nombre con el que te ve el comprador en cada disco.",
      lleno: (p) => !!(p.name || "").trim(),
      resumen: (p) => p.name,
      form: (p) => `<input id="q-name" placeholder="Vinyl Store" value="${esc(p.name)}" style="flex:1;min-width:180px">`,
      leer: () => {
        const name = document.getElementById("q-name").value.trim();
        if (name.length < 2) return { error: "Poné un nombre" };
        return { name };
      } },

    { k: "cel", tit: "Tu celular", ico: "📱",
      por: "Por acá te escribimos cuando vendés, y es como te ubica el comprador.",
      lleno: (p) => !!(p.whatsapp || "").trim(),
      resumen: (p) => p.whatsapp,
      form: (p) => `<input id="q-cel" type="tel" placeholder="11 2345 6789" value="${esc(p.whatsapp)}" style="flex:1;min-width:180px">`,
      leer: () => ({ whatsapp: document.getElementById("q-cel").value.trim() || null }) },

    { k: "zona", tit: "Tu zona", ico: "📍",
      por: "El comprador filtra por zona para encontrar discos cerca suyo.",
      lleno: (p) => !!(p.zona || "").trim(),
      resumen: (p) => [p.zona, p.localidad].filter(Boolean).join(" · "),
      form: () => `<select id="q-zona" style="flex:1;min-width:150px"></select>
                   <input id="q-loc" style="flex:1;min-width:150px">`,
      luego: (p) => zonaSelector(document.getElementById("q-zona"), document.getElementById("q-loc"),
                                 p.zona || "", p.localidad || ""),
      leer: () => ({ zona: document.getElementById("q-zona").value || null,
                     localidad: document.getElementById("q-loc").value || null }) },

    { k: "dir", tit: "Tu dirección", ico: "🏠", privado: true,
      por: "Solo la usamos para pasar a retirar el disco cuando vendas. No la ve nadie más.",
      lleno: (p) => !!(p.direccion || "").trim(),
      resumen: (p) => [p.direccion, p.cp && "CP " + p.cp].filter(Boolean).join(" · "),
      form: (p) => `<input id="q-dir" placeholder="Calle, número, piso" value="${esc(p.direccion)}" style="flex:2;min-width:200px">
                    <input id="q-cp" placeholder="CP" value="${esc(p.cp)}" style="flex:1;min-width:90px">`,
      leer: () => ({ direccion: document.getElementById("q-dir").value.trim() || null,
                     cp: document.getElementById("q-cp").value.trim() || null }) },

    { k: "alias", tit: "Dónde cobrás", ico: "💰", privado: true,
      por: "Sin alias no te podemos transferir lo que vendas. Solo lo vemos nosotros.",
      lleno: (p) => !!(p.alias || "").trim(),
      resumen: (p) => p.alias + (p.titular ? " · " + p.titular : ""),
      form: (p) => `<input id="q-alias" placeholder="Tu alias o CBU" value="${esc(p.alias)}" style="flex:1;min-width:170px">
                    <input id="q-tit" placeholder="Titular de la cuenta" value="${esc(p.titular)}" style="flex:1;min-width:170px">`,
      leer: () => {
        const alias = document.getElementById("q-alias").value.trim();
        if (alias.length < 6) return { error: "Revisá el alias, parece incompleto" };
        return { alias, titular: document.getElementById("q-tit").value.trim() || null };
      } },

    { k: "foto", tit: "Tu foto", ico: "📷",
      por: "Un perfil con foto da más confianza que uno con iniciales.",
      lleno: (p) => !!p.avatar_url,
      resumen: () => "Cargada",
      accion: () => document.getElementById("ava-file").click() },
  ];

  let abierto = null;

  const pintarPerfil = (p) => {
    const hechos = CAMPOS.filter((c) => c.lleno(p)).length;
    const pct = Math.round((hechos / CAMPOS.length) * 100);
    const faltan = CAMPOS.length - hechos;

    perfilBox.innerHTML = `
      <div class="panel" style="max-width:none;padding:0;overflow:hidden">
        <div style="padding:15px 16px 14px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px">
            <strong style="font-size:15px">${faltan ? `Tu perfil está al ${pct}%` : "✅ Tus datos están completos"}</strong>
            <span class="hint">${faltan ? faltan + (faltan === 1 ? " dato sin cargar" : " datos sin cargar") : "no falta nada"}</span>
          </div>
          <div style="height:7px;background:#eee;border-radius:99px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${faltan ? "var(--acc)" : "#2ea860"};transition:width .3s"></div>
          </div>
        </div>
        ${CAMPOS.map((c) => {
          const ok = c.lleno(p);
          const editando = abierto === c.k;
          return `
          <div style="border-top:1px solid var(--line);padding:13px 16px">
            <div style="display:flex;align-items:flex-start;gap:11px">
              <span style="font-size:17px;line-height:1.3;flex:none">${ok ? "✅" : c.ico}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:14px">${c.tit}
                  ${c.privado ? `<span class="hint" style="font-weight:400"> · privado</span>` : ""}</div>
                <div class="hint" style="margin-top:2px;line-height:1.5;${ok ? "" : "color:#a05a00"}">
                  ${ok ? (c.resumen(p) || "cargado") : c.por}</div>
              </div>
              <button class="btn small ${ok ? "ghost" : ""}" data-campo="${c.k}" style="flex:none">
                ${editando ? "Cancelar" : ok ? "Cambiar" : "Cargar"}</button>
            </div>
            ${editando && c.form ? `
              <form data-form="${c.k}" style="display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 2px 28px">
                ${c.form(p)}
                <button class="btn small" type="submit" style="flex:none">Guardar</button>
              </form>` : ""}
          </div>`;
        }).join("")}
      </div>`;

    perfilBox.querySelectorAll("[data-campo]").forEach((b) => {
      b.onclick = () => {
        const c = CAMPOS.find((x) => x.k === b.dataset.campo);
        if (c.accion) return c.accion();
        abierto = abierto === c.k ? null : c.k;
        pintarPerfil(p);
      };
    });

    const c = CAMPOS.find((x) => x.k === abierto);
    if (c && c.luego) c.luego(p);

    perfilBox.querySelectorAll("[data-form]").forEach((f) => {
      f.onsubmit = async (e) => {
        e.preventDefault();
        const campo = CAMPOS.find((x) => x.k === f.dataset.form);
        const datos = campo.leer();
        if (datos.error) return toast(datos.error, true);
        const { error } = await sb.from("profiles").update(datos).eq("id", user.id);
        if (error) return toast(error.message, true);
        Object.assign(perfil, datos);
        abierto = null;
        toast("Datos guardados");
        pintarPerfil(perfil);
      };
    });
  };
  pintarPerfil(perfil);

  // Lista de discos con acciones
  const lista = document.getElementById("lista");
  lista.innerHTML = (discos || []).map(d => `
    <div class="list-item">
      <img src="${fotoPrincipal(d)}">
      <div class="grow">
        <strong>${d.artist} – ${d.title}</strong><br>
        <span class="hint">recibís ${fmtPrecio(d.price)} · ${d.status}</span>
      </div>
      ${d.status === "vendido" ? `
        <span class="hint" title="Un disco vendido no se puede editar ni volver a poner en venta">
          🔒 Vendido</span>` : `
        <select data-id="${d.id}" class="sel-estado" style="width:auto">
          ${["disponible", "reservado"].map(s => `<option ${s === d.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
        <a class="btn small ghost" href="/publicar.html?edit=${d.id}">✎ Editar</a>
        <button class="btn small ghost btn-del" data-id="${d.id}">Borrar</button>`}
    </div>`).join("") || "<p class='sub'>Todavía no publicaste discos.</p>";

  lista.querySelectorAll(".sel-estado").forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from("records").update({ status: sel.value }).eq("id", sel.dataset.id);
    error ? toast(error.message, true) : toast("Estado actualizado");
  });
  lista.querySelectorAll(".btn-del").forEach(b => b.onclick = async () => {
    if (!confirm("¿Borrar este disco?")) return;
    const { error } = await sb.from("records").delete().eq("id", b.dataset.id);
    error ? toast(error.message, true) : renderPanel(user, perfil);
  });

  document.getElementById("btn-out").onclick = async () => { await sb.auth.signOut(); init(); };

  // Foto de perfil
  document.getElementById("ava-file").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) return toast("La foto es muy pesada (máx. 3 MB)", true);
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
    const path = `avatars/${user.id}-${Date.now()}.${ext}`;
    const { error: e1 } = await sb.storage.from("records").upload(path, f);
    if (e1) return toast(e1.message, true);
    const { data: pu } = sb.storage.from("records").getPublicUrl(path);
    const { error: e2 } = await sb.from("profiles").update({ avatar_url: pu.publicUrl }).eq("id", user.id);
    if (e2) return toast(e2.message, true);
    toast("Foto de perfil actualizada");
    Object.assign(perfil, { avatar_url: pu.publicUrl });
    document.getElementById("ava-view").innerHTML = `<img src="${pu.publicUrl}" alt="">`;
    pintarPerfil(perfil);
  };

}

init();
</script>
</body>
</html>
