<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Mi cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, fmtPrecio, fotoPrincipal, toast } from "/js/app.js";
renderHeader("cuenta");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés vender con pago online.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) return renderAuth();
  const perfil = await getPerfil(user.id);
  if (!perfil) return renderCrearPerfil(user);
  renderPanel(user, perfil);
}

/* ---------- LOGIN / REGISTRO ---------- */
const loginGoogle = async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + "/cuenta.html" },
  });
  if (error) toast(error.message, true);
};

function renderAuth() {
  main.innerHTML = `
    <h1>Ingresar</h1>
    <p class="sub">Registrate gratis. Publicar discos no cuesta nada: SURCOGS cobra 15% solo cuando vendés (0% tus primeros 30 días).</p>
    <form class="panel" id="f-auth">
      <button class="btn ghost" type="button" id="btn-google" style="width:100%">Continuar con Google</button>
      <div class="divider"><span>o con tu email</span></div>
      <label>Email</label><input id="a-email" type="email" required>
      <label>Contraseña</label><input id="a-pass" type="password" minlength="6" required>
      <br><br>
      <button class="btn" type="submit">Ingresar</button>
      <button class="btn ghost" type="button" id="btn-reg">Crear cuenta</button>
    </form>

    <!-- Modal de registro -->
    <div class="modal-bg" id="modal-reg" style="display:none">
      <div class="modal">
        <h2 style="margin-bottom:4px">Crear cuenta</h2>
        <p class="hint" style="margin-bottom:10px">Un solo paso y ya podés comprar y vender.</p>
        <button class="btn ghost" type="button" id="btn-google-reg" style="width:100%">Registrarme con Google</button>
        <div class="divider"><span>o completá a mano</span></div>
        <form id="f-reg">
          <label>Nombre o alias *</label><input id="r-name" required>
          <label>Email *</label><input id="r-email" type="email" required>
          <label>Contraseña (mín. 6) *</label><input id="r-pass" type="password" minlength="6" required>
          <label>Zona / barrio</label><input id="r-zona" placeholder="Palermo, CABA">
          <br><br>
          <button class="btn" type="submit" id="btn-reg-go">Crear mi cuenta</button>
          <button class="btn ghost" type="button" id="btn-reg-close">Cancelar</button>
        </form>
      </div>
    </div>`;

  const email = () => document.getElementById("a-email").value.trim();
  const pass = () => document.getElementById("a-pass").value;
  const modal = document.getElementById("modal-reg");

  document.getElementById("f-auth").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: email(), password: pass() });
    error ? toast(error.message, true) : init();
  };
  document.getElementById("btn-google").onclick = loginGoogle;
  document.getElementById("btn-google-reg").onclick = loginGoogle;
  document.getElementById("btn-reg").onclick = () => { modal.style.display = "flex"; };
  document.getElementById("btn-reg-close").onclick = () => { modal.style.display = "none"; };
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

  document.getElementById("f-reg").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-reg-go");
    btn.disabled = true; btn.textContent = "Creando…";
    const v = (id) => document.getElementById(id).value.trim();
    const { data, error } = await sb.auth.signUp({ email: v("r-email"), password: document.getElementById("r-pass").value });
    if (error) { toast(error.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    // Crear el perfil en el mismo paso
    if (data.user) {
      const { error: e2 } = await sb.from("profiles").insert({
        id: data.user.id, name: v("r-name"), zona: v("r-zona") || null,
      });
      if (e2) { toast(e2.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    }
    toast("¡Cuenta creada! Bienvenido a SURCOGS");
    modal.style.display = "none";
    init();
  };
}

/* ---------- PRIMER PERFIL (usuarios de Google) ---------- */
function renderCrearPerfil(user) {
  const sugerido = user.user_metadata?.full_name || user.user_metadata?.name || "";
  main.innerHTML = `
    <h1>Último paso</h1>
    <p class="sub">Confirmá cómo te van a ver los demás y listo.</p>
    <form class="panel" id="f-perfil">
      <label>Nombre o alias</label><input id="p-name" value="${sugerido.replace(/"/g, "&quot;")}" required>
      <label>Zona / barrio</label><input id="p-zona" placeholder="Palermo, CABA">
      <br><br><button class="btn" type="submit">Guardar y empezar</button>
    </form>`;
  document.getElementById("f-perfil").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from("profiles").insert({
      id: user.id,
      name: document.getElementById("p-name").value.trim(),
      zona: document.getElementById("p-zona").value.trim() || null,
    });
    error ? toast(error.message, true) : location.href = "/publicar.html";
  };
}

/* ---------- PANEL ---------- */
async function renderPanel(user, perfil) {
  const alta = new Date(perfil.created_at);
  const finPromo = new Date(alta.getTime() + 30 * 86400000);
  const enPromo = Date.now() < finPromo.getTime();

  const [{ data: discos }, { data: ventas }] = await Promise.all([
    sb.from("records").select("*").eq("seller_id", user.id).order("created_at", { ascending: false }),
    sb.from("orders").select("*").eq("seller_id", user.id).eq("status", "pagada"),
  ]);

  main.innerHTML = `
    <h1>Hola, ${perfil.name}</h1>
    <p class="sub">${perfil.zona || ""}</p>
    ${enPromo
      ? `<div class="notice">🎉 Estás en tu promo de lanzamiento: <strong>0% de comisión</strong> hasta el ${finPromo.toLocaleDateString("es-AR")}. Después, 15% por venta — solo si vendés.</div>`
      : `<div class="notice">Comisión vigente: <strong>15% por venta</strong>, descontada automáticamente del pago. Nunca ponés plata de tu bolsillo.</div>`}
    <div id="mp-box"></div>
    <p style="margin:18px 0"><a class="btn" href="/publicar.html">+ Publicar un disco</a>
      <button class="btn ghost" id="btn-out" style="margin-left:8px">Salir</button></p>
    <div class="mis-discos">
      <h2 style="font-size:18px;margin-bottom:12px">Mis discos (${(discos || []).length})</h2>
      <div id="lista"></div>
    </div>
    <div class="mis-discos">
      <h2 style="font-size:18px;margin-bottom:12px">Ventas concretadas (${(ventas || []).length})</h2>
      ${(ventas || []).map(v => `<div class="list-item"><div class="grow">${fmtPrecio(v.amount)} · comisión ${fmtPrecio(v.fee)} · ${new Date(v.created_at).toLocaleDateString("es-AR")}</div></div>`).join("") || "<p class='sub'>Todavía no tenés ventas.</p>"}
    </div>`;

  // Estado Mercado Pago
  const mpBox = document.getElementById("mp-box");
  if (perfil.mp_connected) {
    mpBox.innerHTML = `<p class="sub">✅ Mercado Pago conectado — tus discos se venden con pago online.</p>`;
  } else {
    mpBox.innerHTML = `
      <div class="panel" style="max-width:none">
        <strong>Conectá Mercado Pago para empezar a vender</strong>
        <p class="hint" style="margin:6px 0 12px">Es requisito para publicar: los compradores pagan online con protección de Mercado Pago, la plata te llega directo a tu cuenta y la comisión se descuenta sola. Una sola vez, un minuto, sin costo.</p>
        <button class="btn small" id="btn-mp">Conectar Mercado Pago</button>
      </div>`;
    document.getElementById("btn-mp").onclick = async () => {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch("/.netlify/functions/mp-oauth-start", {
        headers: { Authorization: "Bearer " + session.access_token },
      });
      const j = await r.json();
      if (j.url) location.href = j.url; else toast(j.error || "Error", true);
    };
  }

  // Lista de discos con acciones
  const lista = document.getElementById("lista");
  lista.innerHTML = (discos || []).map(d => `
    <div class="list-item">
      <img src="${fotoPrincipal(d)}">
      <div class="grow">
        <strong>${d.artist} – ${d.title}</strong><br>
        <span class="hint">recibís ${fmtPrecio(d.price)} · ${d.status}</span>
      </div>
      <select data-id="${d.id}" class="sel-estado" style="width:auto">
        ${["disponible", "reservado", "vendido"].map(s => `<option ${s === d.status ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <button class="btn small ghost btn-del" data-id="${d.id}">Borrar</button>
    </div>`).join("") || "<p class='sub'>Todavía no publicaste discos.</p>";

  lista.querySelectorAll(".sel-estado").forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from("records").update({ status: sel.value }).eq("id", sel.dataset.id);
    error ? toast(error.message, true) : toast("Estado actualizado");
  });
  lista.querySelectorAll(".btn-del").forEach(b => b.onclick = async () => {
    if (!confirm("¿Borrar este disco?")) return;
    const { error } = await sb.from("records").delete().eq("id", b.dataset.id);
    error ? toast(error.message, true) : renderPanel(user, perfil);
  });

  document.getElementById("btn-out").onclick = async () => { await sb.auth.signOut(); init(); };
}

init();
</script>
</body>
</html>
