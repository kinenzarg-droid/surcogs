<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURCOGS — Mi cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
</head>
<body>
<div id="header"></div>
<div class="wrap" id="main"></div>

<script type="module">
import { sb, renderHeader, getUser, getPerfil, fmtPrecio, fotoPrincipal, toast, zonaSelector } from "/js/app.js?v=2";
renderHeader("cuenta");
const main = document.getElementById("main");

const mpParam = new URLSearchParams(location.search).get("mp");
if (mpParam === "ok") toast("¡Mercado Pago conectado! Ya podés vender con pago online.");
if (mpParam === "error") toast("No se pudo conectar Mercado Pago. Probá de nuevo.", true);

async function init() {
  const user = await getUser();
  if (!user) return renderAuth();
  const perfil = await getPerfil(user.id);
  if (!perfil) return renderCrearPerfil(user);
  renderPanel(user, perfil);
}

/* ---------- LOGIN / REGISTRO ---------- */
const loginGoogle = async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + "/cuenta.html" },
  });
  if (error) toast(error.message, true);
};

function renderAuth() {
  main.innerHTML = `
    <h1>Ingresar</h1>
    <p class="sub">Registrate gratis. Publicar no cuesta nada: SURCOGS cobra una comisión solo cuando vendés.</p>
    <form class="panel" id="f-auth">
      <button class="btn ghost" type="button" id="btn-google" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="17" height="17" viewBox="0 0 48 48" style="pointer-events:none"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.4 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.7-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.6-3.8-13.5-9.1l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>Continuar con Google</button>
      <div class="divider"><span>o con tu email</span></div>
      <label>Email</label><input id="a-email" type="email" required>
      <label>Contraseña</label><input id="a-pass" type="password" minlength="6" required>
      <br><br>
      <button class="btn" type="submit">Ingresar</button>
      <button class="btn ghost" type="button" id="btn-reg">Crear cuenta</button>
    </form>

    <!-- Modal de registro -->
    <div class="modal-bg" id="modal-reg" style="display:none">
      <div class="modal">
        <h2 style="margin-bottom:4px">Crear cuenta</h2>
        <p class="hint" style="margin-bottom:10px">Un solo paso y ya podés comprar y vender.</p>
        <button class="btn ghost" type="button" id="btn-google-reg" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="17" height="17" viewBox="0 0 48 48" style="pointer-events:none"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.4 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.7-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.6-3.8-13.5-9.1l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>Registrarme con Google</button>
        <div class="divider"><span>o completá a mano</span></div>
        <form id="f-reg">
          <label>Nombre o alias *</label><input id="r-name" placeholder="Vinyl Store" required>
          <label>Email *</label><input id="r-email" type="email" required>
          <label>Contraseña (mín. 6) *</label><input id="r-pass" type="password" minlength="6" required>
          <label>Repetir contraseña *</label><input id="r-pass2" type="password" minlength="6" required>
          <label>Celular (WhatsApp)</label><input id="r-cel" type="tel" placeholder="11 2345 6789">
          <label>Zona</label><select id="r-zona"></select>
          <label>Localidad / barrio</label><input id="r-loc">
          <br><br>
          <button class="btn" type="submit" id="btn-reg-go">Crear mi cuenta</button>
          <button class="btn ghost" type="button" id="btn-reg-close">Cancelar</button>
        </form>
      </div>
    </div>`;

  const email = () => document.getElementById("a-email").value.trim();
  const pass = () => document.getElementById("a-pass").value;
  const modal = document.getElementById("modal-reg");

  document.getElementById("f-auth").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: email(), password: pass() });
    error ? toast(error.message, true) : init();
  };
  document.getElementById("btn-google").onclick = loginGoogle;
  document.getElementById("btn-google-reg").onclick = loginGoogle;
  zonaSelector(document.getElementById("r-zona"), document.getElementById("r-loc"));
  document.getElementById("btn-reg").onclick = () => { modal.style.display = "flex"; };
  document.getElementById("btn-reg-close").onclick = () => { modal.style.display = "none"; };
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

  // /cuenta.html?registro=1 → abrir directo el formulario de crear cuenta
  if (new URLSearchParams(location.search).get("registro")) modal.style.display = "flex";

  document.getElementById("f-reg").onsubmit = async (e) => {
    e.preventDefault();
    if (document.getElementById("r-pass").value !== document.getElementById("r-pass2").value) {
      return toast("Las contraseñas no coinciden. Revisalas.", true);
    }
    const btn = document.getElementById("btn-reg-go");
    btn.disabled = true; btn.textContent = "Creando…";
    const v = (id) => document.getElementById(id).value.trim();
    const { data, error } = await sb.auth.signUp({ email: v("r-email"), password: document.getElementById("r-pass").value });
    if (error) { toast(error.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    // Crear el perfil en el mismo paso
    if (data.user) {
      const { error: e2 } = await sb.from("profiles").insert({
        id: data.user.id, name: v("r-name"),
        zona: v("r-zona") || null, localidad: v("r-loc") || null,
        whatsapp: v("r-cel") || null,
      });
      if (e2) { toast(e2.message, true); btn.disabled = false; btn.textContent = "Crear mi cuenta"; return; }
    }
    toast("¡Cuenta creada! Bienvenido a SURCOGS");
    modal.style.display = "none";
    init();
  };
}

/* ---------- PRIMER PERFIL (usuarios de Google) ---------- */
function renderCrearPerfil(user) {
  const sugerido = user.user_metadata?.full_name || user.user_metadata?.name || "";
  main.innerHTML = `
    <h1>Último paso</h1>
    <p class="sub">Confirmá cómo te van a ver los demás y listo.</p>
    <form class="panel" id="f-perfil">
      <label>Nombre o alias</label><input id="p-name" value="${sugerido.replace(/"/g, "&quot;")}" placeholder="Vinyl Store" required>
      <label>Celular (WhatsApp)</label><input id="p-cel" type="tel" placeholder="11 2345 6789">
      <label>Zona</label><select id="p-zona"></select>
      <label>Localidad / barrio</label><input id="p-loc">
      <br><br><button class="btn" type="submit">Guardar y empezar</button>
    </form>`;
  zonaSelector(document.getElementById("p-zona"), document.getElementById("p-loc"));
  document.getElementById("f-perfil").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from("profiles").insert({
      id: user.id,
      name: document.getElementById("p-name").value.trim(),
      whatsapp: document.getElementById("p-cel").value.trim() || null,
      zona: document.getElementById("p-zona").value || null,
      localidad: document.getElementById("p-loc").value || null,
    });
    error ? toast(error.message, true) : location.href = "/publicar.html";
  };
}

/* ---------- PANEL ---------- */
async function renderPanel(user, perfil) {

  const [{ data: discos }, { data: ventas }] = await Promise.all([
    sb.from("records").select("*").eq("seller_id", user.id).order("created_at", { ascending: false }),
    sb.from("orders").select("*, records(artist, title)").eq("seller_id", user.id).eq("status", "pagada").order("created_at", { ascending: false }),
  ]);

  const iniciales = (perfil.name || "").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "YO";
  main.innerHTML = `
    <h1 style="display:flex;align-items:center;gap:14px">
      <span class="avatar" id="ava-view" style="width:54px;height:54px;font-size:19px;flex:none;display:inline-flex;align-items:center;justify-content:center">
        ${perfil.avatar_url ? `<img src="${perfil.avatar_url}" alt="">` : iniciales}</span>
      <span>Hola, ${perfil.name}</span>
    </h1>
    <p class="sub">📍 ${[perfil.zona, perfil.localidad].filter(Boolean).join(" · ") || "Sin ubicación"}
      · 📱 ${perfil.whatsapp || "sin celular"}
      <a href="#" id="btn-ubic" style="color:var(--acc);font-size:12.5px;margin-left:8px">editar</a>
      · <a href="#" id="btn-ava" style="color:var(--acc);font-size:12.5px">📷 ${perfil.avatar_url ? "cambiar foto" : "subir foto"}</a>
      <input id="ava-file" type="file" accept="image/*" style="display:none"></p>
    <form id="f-ubic" style="display:none;gap:8px;margin:0 0 14px;max-width:560px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="u-zona" style="flex:1;min-width:140px"></select>
        <input id="u-loc" style="flex:1;min-width:140px">
        <input id="u-cel" type="tel" placeholder="Celular (WhatsApp)" style="flex:1;min-width:140px">
        <button class="btn small" type="submit">Guardar</button>
      </div>
    </form>
    <div class="notice">Publicás tu precio y esa plata es tuya. El comprador ve tu precio más la comisión de SURCOGS y Mercado Pago, que se descuentan solas del pago. Nunca ponés plata de tu bolsillo.</div>
    <div id="cobro-box"></div>
    <p style="margin:18px 0"><a class="btn" href="/publicar.html">+ Publicar un disco</a>
      <a class="btn ghost" href="/perfil.html?id=${user.id}" style="margin-left:8px">Ver mi perfil público</a>
      <button class="btn ghost" id="btn-out" style="margin-left:8px">Salir</button></p>
    <div class="mis-discos">
      <h2 style="font-size:18px;margin-bottom:12px">Mis discos (${(discos || []).length})</h2>
      <div id="lista"></div>
    </div>
    <div class="mis-discos">
      <h2 style="font-size:18px;margin-bottom:12px">Ventas concretadas (${(ventas || []).length})</h2>
      ${(ventas || []).map(v => `
        <div class="list-item">
          <div class="grow">
            <strong>${v.records ? v.records.artist + " – " + v.records.title : "Disco"}</strong><br>
            <span class="hint">${fmtPrecio(v.amount)} · comisión ${fmtPrecio(v.fee)} · ${new Date(v.created_at).toLocaleDateString("es-AR")}
            ${v.buyer_email ? " · comprador: " + v.buyer_email : ""}</span>
          </div>
          ${v.buyer_email ? `<a class="btn small" href="mailto:${v.buyer_email}?subject=${encodeURIComponent("Tu compra en SURCOGS")}&body=${encodeURIComponent("¡Hola! Soy " + perfil.name + ", me compraste " + (v.records ? v.records.artist + " – " + v.records.title : "un disco") + " en SURCOGS. ¿Coordinamos la entrega? Puedo ofrecerte punto de encuentro o envío por Correo Argentino a tu sucursal más cercana (va embalado en cartón rígido y con seguimiento).")}">✉ Contactar</a>` : ""}
        </div>`).join("") || "<p class='sub'>Todavía no tenés ventas.</p>"}
    </div>`;

  // Dónde cobrás tus ventas
  const cobroBox = document.getElementById("cobro-box");
  const pintarCobro = (p) => {
    const tiene = !!(p.alias && p.alias.trim());
    cobroBox.innerHTML = `
      <div class="panel" style="max-width:none;${tiene ? "" : "border-color:var(--acc)"}">
        <strong>${tiene ? "✅ Dónde cobrás tus ventas" : "Cargá tu alias para poder cobrar"}</strong>
        <p class="hint" style="margin:6px 0 10px">
          ${tiene
            ? `Te transferimos a <b>${p.alias}</b>${p.titular ? " (" + p.titular + ")" : ""} dentro de las 48hs hábiles de que el comprador confirme que recibió el disco.`
            : "El comprador te paga a través de SURCOGS. Cuando confirma que recibió el disco, te transferimos a tu alias dentro de las 48hs hábiles. Sin alias no podemos pagarte."}
        </p>
        <form id="f-cobro" style="display:${tiene ? "none" : "flex"};gap:8px;flex-wrap:wrap;align-items:center">
          <input id="c-alias" placeholder="Tu alias o CBU" value="${p.alias || ""}" style="flex:1;min-width:180px">
          <input id="c-titular" placeholder="Titular de la cuenta" value="${p.titular || ""}" style="flex:1;min-width:180px">
          <button class="btn small" type="submit">Guardar</button>
        </form>
        ${tiene ? `<a href="#" id="btn-cobro" style="color:var(--acc);font-size:12.5px">cambiar</a>` : ""}
      </div>`;
    const btn = document.getElementById("btn-cobro");
    if (btn) btn.onclick = (e) => {
      e.preventDefault();
      document.getElementById("f-cobro").style.display = "flex";
      btn.style.display = "none";
    };
    document.getElementById("f-cobro").onsubmit = async (e) => {
      e.preventDefault();
      const alias = document.getElementById("c-alias").value.trim();
      const titular = document.getElementById("c-titular").value.trim() || null;
      if (alias.length < 6) return toast("Revisá el alias, parece incompleto", true);
      const { error } = await sb.from("profiles").update({ alias, titular }).eq("id", user.id);
      if (error) return toast(error.message, true);
      Object.assign(perfil, { alias, titular });
      toast("Listo, ya podemos transferirte");
      pintarCobro(perfil);
    };
  };
  pintarCobro(perfil);

  // Lista de discos con acciones
  const lista = document.getElementById("lista");
  lista.innerHTML = (discos || []).map(d => `
    <div class="list-item">
      <img src="${fotoPrincipal(d)}">
      <div class="grow">
        <strong>${d.artist} – ${d.title}</strong><br>
        <span class="hint">recibís ${fmtPrecio(d.price)} · ${d.status}</span>
      </div>
      <select data-id="${d.id}" class="sel-estado" style="width:auto">
        ${["disponible", "reservado", "vendido"].map(s => `<option ${s === d.status ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <a class="btn small ghost" href="/publicar.html?edit=${d.id}">✎ Editar</a>
      <button class="btn small ghost btn-del" data-id="${d.id}">Borrar</button>
    </div>`).join("") || "<p class='sub'>Todavía no publicaste discos.</p>";

  lista.querySelectorAll(".sel-estado").forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from("records").update({ status: sel.value }).eq("id", sel.dataset.id);
    error ? toast(error.message, true) : toast("Estado actualizado");
  });
  lista.querySelectorAll(".btn-del").forEach(b => b.onclick = async () => {
    if (!confirm("¿Borrar este disco?")) return;
    const { error } = await sb.from("records").delete().eq("id", b.dataset.id);
    error ? toast(error.message, true) : renderPanel(user, perfil);
  });

  document.getElementById("btn-out").onclick = async () => { await sb.auth.signOut(); init(); };

  // Foto de perfil
  document.getElementById("btn-ava").onclick = (e) => {
    e.preventDefault();
    document.getElementById("ava-file").click();
  };
  document.getElementById("ava-file").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) return toast("La foto es muy pesada (máx. 3 MB)", true);
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
    const path = `avatars/${user.id}-${Date.now()}.${ext}`;
    const { error: e1 } = await sb.storage.from("records").upload(path, f);
    if (e1) return toast(e1.message, true);
    const { data: pu } = sb.storage.from("records").getPublicUrl(path);
    const { error: e2 } = await sb.from("profiles").update({ avatar_url: pu.publicUrl }).eq("id", user.id);
    if (e2) return toast(e2.message, true);
    toast("Foto de perfil actualizada");
    renderPanel(user, { ...perfil, avatar_url: pu.publicUrl });
  };

  // Cambiar ubicación (zona → localidad)
  const fUbic = document.getElementById("f-ubic");
  document.getElementById("btn-ubic").onclick = (e) => {
    e.preventDefault();
    fUbic.style.display = fUbic.style.display === "none" ? "block" : "none";
    zonaSelector(document.getElementById("u-zona"), document.getElementById("u-loc"),
      perfil.zona || "", perfil.localidad || "");
    document.getElementById("u-cel").value = perfil.whatsapp || "";
  };
  fUbic.onsubmit = async (e) => {
    e.preventDefault();
    const zona = document.getElementById("u-zona").value || null;
    const localidad = document.getElementById("u-loc").value || null;
    const whatsapp = document.getElementById("u-cel").value.trim() || null;
    const { error } = await sb.from("profiles").update({ zona, localidad, whatsapp }).eq("id", user.id);
    if (error) return toast(error.message, true);
    toast("Datos actualizados");
    renderPanel(user, { ...perfil, zona, localidad, whatsapp });
  };
}

init();
</script>
</body>
</html>
